<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TP4 - Gráficos de Control</title>
        <link rel="stylesheet" href="./assets/variable.css" />
        <link rel="stylesheet" href="./assets/styles.css" />
        <!-- Chart.js (versión 4 fija) para dibujar el gráfico -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    </head>
    <body>
        <header>
            <h1>Gráficos de Control</h1>
            <p>Estadística y Probabilidades — TP Nro 4</p>
        </header>

        <main>
            <!-- Selector del caso a consultar en la API -->
            <section class="controls">
                <label for="caso">Seleccionar caso:</label>
                <select id="caso">
                    <option value="1">Caso 1 — Fuera de control</option>
                    <option value="2">Caso 2 — Normal</option>
                    <option value="3">Caso 3 — 2 de 3 puntos fuera de 2σ</option>
                    <option value="4">Caso 4 — 4 de 5 puntos fuera de 1σ</option>
                    <option value="5">Caso 5 — 8 puntos consecutivos mismo lado</option>
                </select>
                <button id="btnCargar">Cargar</button>
            </section>

            <!-- Gráfico de control -->
            <section class="chart-container">
                <canvas id="graficoControl"></canvas>
            </section>

            <!-- Alertas de texto generadas por main.js -->
            <section id="alertas" class="alertas" aria-live="polite"></section>

            <!-- Tabla con los valores y el estado de cada muestra -->
            <section class="datos">
                <table id="tablaDatos">
                    <thead>
                        <tr>
                            <th>X (muestreo)</th>
                            <th>Y (valor)</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>

        <script src="main.js"></script>
    </body>
</html>
